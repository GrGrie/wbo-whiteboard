<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>TechBrain WBO</title>
	<link rel="icon" type="image/png" href="favicon.ico" />
	<link rel="stylesheet" href="index.css?v=20260603-6" />
	<meta name="description" content="An enhanced WBO fork crafted by GrGrie for focused online whiteboard work."/>
	<meta name="keywords" content="whiteboard,collaborative,online,draw,paint,shared,realtime,wbo,grgrie"/>
	<link rel="icon" type="image/x-icon" sizes="16x16 32x32 64x64" href="favicon.ico">
	<link rel="icon" type="image/svg+xml" sizes="256x256" href="favicon.svg">
	<link rel="apple-touch-icon" href="favicon.svg">
	<link rel="mask-icon" href="favicon.svg" color="black">
</head>

<body>

<main>
	<section class="hero">
		<div class="brand">TechBrain WBO</div>
		<div class="hero-copy">
			<p class="eyebrow">An enhanced WBO fork crafted by GrGrie</p>
			<h1>Open a board and start shaping the lesson.</h1>
			<p class="subtitle">A focused whiteboard for sketches, sheets, notes, and shared problem solving.</p>
		</div>

		<form action="./board.html" method="GET" class="board-form">
			<label for="board">Name of the board</label>
			<p class="auth-error" id="authError">Only GrGrie's credentials can create a new board.</p>
			<div class="board-controls">
				<input type="text" id="board" name="board" placeholder="Ivan, Algebra, Lesson-01" autofocus />
				<input type="text" id="login" name="login" placeholder="Login" autocomplete="username" />
				<input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" />
				<button type="submit">Open board</button>
			</div>
			<a href="./board.html" class="public-board">Open the public board</a>
		</form>
	</section>
</main>

<footer>
	<a href="https://github.com/rdbeach/wb" class="smallink">Original WBO source</a>
</footer>

<script>
	if (new URLSearchParams(window.location.search).get("auth") === "failed") {
		document.getElementById("authError").style.display = "block";
	}
</script>
	
</body>

</html>
