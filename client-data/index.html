<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>GrGrie Whiteboard</title>
	<link rel="icon" type="image/png" sizes="any" href="logo.png?v=20260603-1" />
	<link rel="stylesheet" href="index.css?v=20260603-7" />
	<meta name="description" content="An enhanced WBO fork crafted by GrGrie for focused online whiteboard work."/>
	<meta name="keywords" content="whiteboard,collaborative,online,draw,paint,shared,realtime,wbo,grgrie"/>
	<link rel="apple-touch-icon" href="logo.png?v=20260603-1">
</head>

<body>

<main>
	<section class="hero">
		<div class="hero-copy">
			<h1>An enhanced WBO Whiteboard crafted by GrGrie</h1>
			<p class="intro">Open the board and start shaping the lesson. A focused whiteboard for sketches, sheets, notes, and shared problem solving.</p>
		</div>

		<a href="./board.html" class="public-board">Open public board</a>

		<form action="./dashboard" method="GET" class="board-form">
			<label for="login" class="sr-only">Login</label>
			<p class="auth-error" id="authError">Only GrGrie's credentials can create a new board.</p>
			<div class="board-controls">
				<input type="text" id="login" name="login" placeholder="Login" autocomplete="username" autofocus />
				<input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" />
				<button type="submit">Open dashboard</button>
			</div>
		</form>
	</section>
</main>

<footer>
	<a href="https://github.com/rdbeach/wb" class="smallink">Original WBO source</a>
</footer>

<script>
	if (new URLSearchParams(window.location.search).get("auth") === "failed") {
		document.getElementById("authError").style.display = "block";
	}
</script>
	
</body>

</html>
